<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mind Clash • صراع العقل</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c1a;
      --glass: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f0f0f5;
      --accent: #7c6ff7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(ellipse at center, #1a1d3a 0%, #0b0c1a 100%);
      font-family: 'Tajawal', sans-serif;
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      direction: rtl;
    }

    #app {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 850px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px 20px 30px;
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      transition: opacity 0.3s ease;
    }

    .screen.active {
      display: flex;
      opacity: 1;
      z-index: 2;
    }

    /* ===== START SCREEN ===== */
    .title-glow {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #c792ea, #7c6ff7, #5cc8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(124, 111, 247, 0.5));
      margin-bottom: 10px;
      animation: floatTitle 3s ease-in-out infinite;
    }

    @keyframes floatTitle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .subtitle {
      font-size: 1.1rem;
      color: #bdbdd4;
      margin-bottom: 35px;
      line-height: 1.7;
      padding: 0 10px;
    }

    .btn {
      background: linear-gradient(135deg, #6C63FF 0%, #ff5e7a 100%);
      color: #fff;
      border: none;
      padding: 16px 45px;
      font-size: 1.4rem;
      font-weight: 800;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(108, 99, 255, 0.5);
      transition: transform 0.25s, box-shadow 0.25s;
      letter-spacing: 1px;
      width: 85%;
      max-width: 300px;
    }

    .btn:active {
      transform: scale(0.94);
      box-shadow: 0 5px 18px rgba(108, 99, 255, 0.7);
    }

    /* ===== GAME SCREEN ===== */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 15px 5px;
      font-weight: 700;
      font-size: 1.2rem;
    }
    .badge {
      background: rgba(0,0,0,0.3);
      padding: 6px 16px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .streak-fire {
      font-size: 1.4rem;
      filter: drop-shadow(0 0 8px #ffb300);
    }

    .instruction-pill {
      background: rgba(255,255,255,0.1);
      padding: 10px 25px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1.1rem;
      margin: 15px 0 10px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #eaeaf5;
    }

    .word-display {
      font-size: 5rem;
      font-weight: 900;
      margin: 5px 0 15px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: transform 0.15s ease, text-shadow 0.15s;
      line-height: 1.2;
      min-height: 100px;
      display: flex;
      align-items: center;
    }

    .timer-wrap {
      width: 90%;
      height: 12px;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      margin: 5px 0 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
    }
    #timerFill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #30d158, #ffcc00, #ff3b30);
      border-radius: 20px;
      transition: width 0.06s linear;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      padding: 0 12px 25px;
    }

    .opt-btn {
      background: rgba(20, 20, 40, 0.65);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 22px 8px;
      font-size: 1.7rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      color: #ffffff; /* fallback */
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
      word-break: break-word;
    }

    .opt-btn:active {
      transform: scale(0.93);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255,255,255,0.4);
    }

    /* ===== GAME OVER ===== */
    .stats-box {
      display: flex;
      gap: 20px;
      margin: 20px 0 30px;
    }
    .stat {
      background: rgba(0,0,0,0.3);
      padding: 15px 20px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .stat .val {
      font-size: 2rem;
      font-weight: 800;
      color: #ffd966;
    }

    /* particles canvas */
    #particlesCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .pop-effect {
      animation: pop 0.25s ease-out;
    }
  </style>
</head>
<body>

<div id="app">
  <canvas id="particlesCanvas"></canvas>

  <!-- START SCREEN -->
  <div id="startScreen" class="screen active">
    <div class="title-glow">Mind Clash</div>
    <p class="subtitle">صراع العقل!<br> الكلمة أم اللون؟ ركّز في الأوامر وتغلّب على الخداع البصري.</p>
    <button class="btn" id="startBtn">⚡ ابدأ التحدي</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen">
    <div class="top-bar">
      <div class="badge">⭐ <span id="scoreVal">0</span></div>
      <div class="badge streak-fire">🔥 x<span id="multiVal">1</span></div>
    </div>
    <div class="instruction-pill" id="instructionPill">اختر الكلمة</div>
    <div class="word-display" id="mainWordDisplay">أزرق</div>
    <div class="timer-wrap">
      <div id="timerFill" style="width:100%"></div>
    </div>
    <div class="options-grid" id="optionsContainer"></div>
  </div>

  <!-- GAME OVER SCREEN -->
  <div id="gameOverScreen" class="screen">
    <div class="title-glow" style="font-size:2.5rem;">انتهى الوقت!</div>
    <p class="subtitle">العقل أسرع مما تظن… لكنك كنت رائعاً!</p>
    <div class="stats-box">
      <div class="stat">🏆 النقاط <br><span class="val" id="finalScore">0</span></div>
      <div class="stat">🔥 أعلى مضاعف <br><span class="val">x<span id="finalMulti">1</span></span></div>
    </div>
    <button class="btn" id="replayBtn">🔄 العب مجدداً</button>
  </div>
</div>

<script>
  (function() {
    // ────────────────────────────────────
    // 🔊 AUDIO ENGINE (توليد نغمات بسيطة)
    // ────────────────────────────────────
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }
    function playTone(freq, type, duration, vol = 0.15, glide = 0) {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (glide) osc.frequency.linearRampToValueAtTime(freq + glide, t + duration);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + duration);
    }
    function sfxCorrect() {
      playTone(660, 'sine', 0.15, 0.18, 0);
      setTimeout(() => playTone(880, 'sine', 0.12, 0.12, 0), 80);
    }
    function sfxWrong() {
      playTone(150, 'sawtooth', 0.25, 0.12, -30);
    }
    function sfxClick() {
      playTone(500, 'sine', 0.06, 0.04);
    }

    // ────────────────────────────────────
    // ✨ PARTICLE ENGINE (كانفس)
    // ────────────────────────────────────
    const canvas = document.getElementById('particlesCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = (Math.random() - 0.8) * 6 - 2;
        this.size = Math.random() * 8 + 4;
        this.color = color;
        this.life = 1;
        this.decay = 0.02 + Math.random() * 0.04;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15;
        this.life -= this.decay;
      }
      draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function spawnParticles(x, y, color = '#ffd966') {
      for (let i = 0; i < 18; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => { p.update(); p.draw(ctx); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ────────────────────────────────────
    // 🎮 GAME DATA
    // ────────────────────────────────────
    const COLORS = [
      { name: "أحمر", hex: "#FF3B30" },
      { name: "أزرق", hex: "#0A84FF" },
      { name: "أخضر", hex: "#34C759" },
      { name: "أصفر", hex: "#FFD60A" },
      { name: "بنفسجي", hex: "#BF5AF2" },
      { name: "برتقالي", hex: "#FF9F0A" }
    ];

    const RULES = [
      { text: "اختر الكلمة", type: "WORD" },
      { text: "اختر اللون", type: "COLOR" },
      { text: "تجاهل اللون .. ركّز على الكلمة", type: "WORD" },
      { text: "تجاهل الكلمة .. ركّز على اللون", type: "COLOR" }
    ];

    // ────────────────────────────────────
    // STATE
    // ────────────────────────────────────
    let score = 0;
    let streak = 0;
    let multiplier = 1;
    let maxMultiplier = 1;
    let baseTime = 8000;        // يبدأ 8 ثواني
    const minTime = 4000;       // أقل وقت 4 ثواني
    let timeLeft = baseTime;
    let timerInterval = null;
    let acceptingInput = true;
    let currentRuleType = "WORD";
    let currentWordName = "";
    let currentWordColorHex = "";
    let expectedAnswer = "";     // في WORD: اسم الكلمة, في COLOR: hex اللون

    // DOM
    const screens = {
      start: document.getElementById('startScreen'),
      game: document.getElementById('gameScreen'),
      over: document.getElementById('gameOverScreen')
    };
    const ui = {
      score: document.getElementById('scoreVal'),
      multi: document.getElementById('multiVal'),
      instruction: document.getElementById('instructionPill'),
      mainWord: document.getElementById('mainWordDisplay'),
      timerFill: document.getElementById('timerFill'),
      optionsGrid: document.getElementById('optionsContainer'),
      finalScore: document.getElementById('finalScore'),
      finalMulti: document.getElementById('finalMulti')
    };

    function switchScreen(screen) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[screen].classList.add('active');
    }

    function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // ضبط الوقت حسب السكور (ينزل تدريجياً من 8000 لـ 4000 عند سكور 5000)
    function getCurrentMaxTime() {
      const t = baseTime - (score / 5000) * (baseTime - minTime);
      return Math.max(minTime, Math.floor(t));
    }

    // تحديث واجهة النقاط والمضاعف
    function refreshStatsUI() {
      ui.score.textContent = score;
      ui.multi.textContent = multiplier;
    }

    // ────────────────────────────────────
    // CORE: بناء السؤال
    // ────────────────────────────────────
    function generateQuestion() {
      acceptingInput = true;
      clearInterval(timerInterval);

      // اختيار عشوائي: الكلمة المعروضة ولونها
      const wordObj = randomItem(COLORS);
      const colorObj = randomItem(COLORS);
      const rule = randomItem(RULES);

      currentRuleType = rule.type;
      currentWordName = wordObj.name;
      currentWordColorHex = colorObj.hex;

      // عرض التعليمات والكلمة الكبيرة
      ui.instruction.textContent = rule.text;
      ui.mainWord.textContent = wordObj.name;
      ui.mainWord.style.color = colorObj.hex;

      // تحديد الإجابة المطلوبة:
      if (rule.type === "WORD") {
        // المطلوب اختيار الزر الذي نصه = اسم الكلمة المعروضة
        expectedAnswer = wordObj.name; // string
      } else {
        // المطلوب اختيار الزر الذي لون خطه = لون الكلمة المعروضة
        expectedAnswer = colorObj.hex; // hex string
      }

      // بناء 4 خيارات (واحد صحيح + 3 خاطئة)
      const options = [];
      // --- الخيار الصحيح ---
      if (rule.type === "WORD") {
        options.push({
          text: wordObj.name,
          colorHex: randomItem(COLORS).hex, // لون عشوائي للزر
          isCorrect: true
        });
      } else { // COLOR
        options.push({
          text: randomItem(COLORS).name, // أي نص (للتشتيت)
          colorHex: colorObj.hex,        // نفس لون الكلمة المعروضة
          isCorrect: true
        });
      }

      // --- 3 خيارات خاطئة ---
      const usedTexts = new Set([options[0].text]);
      while (options.length < 4) {
        let candText = randomItem(COLORS).name;
        // نتجنب تكرار النص في الخيارات (لكن ممكن يتكرر اللون عادي)
        if (usedTexts.has(candText) && usedTexts.size < COLORS.length) continue;
        usedTexts.add(candText);

        let candColor = randomItem(COLORS).hex;
        // التأكد أن هذا الخيار ليس مطابقاً للإجابة الصحيحة
        if (rule.type === "WORD") {
          // الخطأ: النص لا يساوي expectedAnswer
          if (candText === expectedAnswer) {
            // نغير النص لشيء آخر
            const alt = COLORS.find(c => c.name !== expectedAnswer);
            candText = alt ? alt.name : candText + "x";
          }
        } else { // COLOR
          // الخطأ: اللون لا يساوي expectedAnswer (hex)
          while (candColor === expectedAnswer) {
            candColor = randomItem(COLORS).hex;
          }
        }

        options.push({
          text: candText,
          colorHex: candColor,
          isCorrect: false
        });
      }

      // خلط
      options.sort(() => Math.random() - 0.5);

      // رسم الأزرار
      ui.optionsGrid.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt.text;
        btn.style.color = opt.colorHex;
        btn.addEventListener('click', (e) => {
          if (!acceptingInput) return;
          sfxClick();
          handleChoice(opt.isCorrect, btn);
        });
        ui.optionsGrid.appendChild(btn);
      });

      // بدء المؤقت بالوقت المناسب
      const maxT = getCurrentMaxTime();
      timeLeft = maxT;
      startTimer(maxT);
    }

    // ────────────────────────────────────
    // ⏱️ المؤقت
    // ────────────────────────────────────
    function startTimer(maxTime) {
      ui.timerFill.style.width = '100%';
      const step = 50; // ms
      timerInterval = setInterval(() => {
        timeLeft -= step;
        const pct = Math.max(0, (timeLeft / maxTime) * 100);
        ui.timerFill.style.width = pct + '%';
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          acceptingInput = false;
          gameOver();
        }
      }, step);
    }

    // ────────────────────────────────────
    // ✅ اختيار اللاعب
    // ────────────────────────────────────
    function handleChoice(isCorrect, btnElement) {
      if (!acceptingInput) return;
      acceptingInput = false;
      clearInterval(timerInterval);

      if (isCorrect) {
        // نجاح
        sfxCorrect();
        // جسيمات من موقع الزر
        const rect = btnElement.getBoundingClientRect();
        const appRect = document.getElementById('app').getBoundingClientRect();
        const cx = rect.left + rect.width/2 - appRect.left;
        const cy = rect.top + rect.height/2 - appRect.top;
        spawnParticles(cx, cy, '#ffd966');

        // تأثير بصري على الكلمة الكبيرة
        ui.mainWord.classList.add('pop-effect');
        setTimeout(() => ui.mainWord.classList.remove('pop-effect'), 250);

        // حساب النقاط
        const timeRatio = timeLeft / getCurrentMaxTime();
        let timeBonus = 0.4;
        if (timeRatio >= 0.8) timeBonus = 1.0;
        else if (timeRatio >= 0.5) timeBonus = 0.75;
        else if (timeRatio >= 0.2) timeBonus = 0.5;
        const gained = Math.floor((100 * (1 + timeBonus)) * multiplier);
        score += gained;

        // المضاعف
        streak++;
        if (streak >= 20) multiplier = 10;
        else if (streak >= 15) multiplier = 5;
        else if (streak >= 10) multiplier = 3;
        else if (streak >= 5) multiplier = 2;
        else multiplier = 1;
        if (multiplier > maxMultiplier) maxMultiplier = multiplier;

        refreshStatsUI();
        setTimeout(generateQuestion, 180);
      } else {
        // خطأ
        sfxWrong();
        // جسيمات حمراء
        const rect = btnElement.getBoundingClientRect();
        const appRect = document.getElementById('app').getBoundingClientRect();
        const cx = rect.left + rect.width/2 - appRect.left;
        const cy = rect.top + rect.height/2 - appRect.top;
        spawnParticles(cx, cy, '#ff3b30');
        gameOver();
      }
    }

    // ────────────────────────────────────
    // 💀 نهاية اللعبة
    // ────────────────────────────────────
    function gameOver() {
      acceptingInput = false;
      clearInterval(timerInterval);
      ui.finalScore.textContent = score;
      ui.finalMulti.textContent = maxMultiplier;
      switchScreen('over');
    }

    // ────────────────────────────────────
    // 🚀 بدء اللعبة
    // ────────────────────────────────────
    function resetAndStart() {
      initAudio();
      score = 0;
      streak = 0;
      multiplier = 1;
      maxMultiplier = 1;
      refreshStatsUI();
      switchScreen('game');
      generateQuestion();
    }

    // ────────────────────────────────────
    // 🎧 أحداث الأزرار الرئيسية
    // ────────────────────────────────────
    document.getElementById('startBtn').addEventListener('click', resetAndStart);
    document.getElementById('replayBtn').addEventListener('click', resetAndStart);

    // أول لمسة للمستخدم تفعّل الصوت (سياسة المتصفح)
    document.body.addEventListener('touchstart', initAudio, { once: true });
    document.body.addEventListener('click', initAudio, { once: true });

    // منع السحب والتمييز
    document.addEventListener('selectstart', e => e.preventDefault());
  })();
</script>
</body>
</html>
